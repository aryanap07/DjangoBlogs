{% extends 'base.html' %}

{% block title %}{{ post.title }} - My Blog{% endblock %}

{% block content %}

<a class="back-link" href="{% url 'index' %}">&larr; Back to all posts</a>

<div class="card">
  <h2>{{ post.title }}</h2>
  <p class="meta">{{ post.created_at }}</p>
  <p>{{ post.body|linebreaks }}</p>
</div>

{% endblock %}
